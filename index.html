<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FINWIRE — Markets, Business &amp; Economy</title>
<meta name="description" content="Client-side financial news aggregator: Bloomberg, Reuters, CNBC Indonesia, Kontan, IDN Financials." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/news.css" />
<link rel="stylesheet" href="css/stock.css" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/portfolio.css" />
<link rel="stylesheet" href="css/dock.css" />
<link rel="stylesheet" href="css/portfolio-detail.css" />
<link rel="stylesheet" href="css/markets.css" />
<link rel="stylesheet" href="css/portfolio-dashboard.css" />
<link rel="stylesheet" href="css/ipos.css" />
</head>
<body>

<!-- ==================== MASTHEAD ==================== -->
<header class="masthead">
  <div class="masthead-inner">
    <a class="brand" href="./" aria-label="FINWIRE home" onclick="switchView('news'); return false;">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">FIN<span class="accent">WIRE</span></span>
    </a>

    <p class="tagline" data-i18n="tagline">Markets · Business · Economy</p>

    <nav class="main-nav">
      <button type="button" id="navNews" class="nav-btn active" data-i18n="navNews">News</button>
      <button type="button" id="navStocks" class="nav-btn" data-i18n="navMarkets">Markets</button>
    </nav>

    <div class="masthead-tools">
      <div class="watch-box">
        <input id="watchInput" type="text" autocomplete="off" spellcheck="false"
               data-i18n-ph="watchPh" placeholder="Add watchlist keyword…" aria-label="Add watchlist keyword" />
        <button id="watchAdd" class="btn btn-mini" type="button" aria-label="Add keyword">+</button>
      </div>

      <button id="markAllRead" class="btn" type="button" data-i18n="markAllRead">Mark all read</button>

      <div class="lang-toggle" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="active">EN</button>
        <button type="button" data-lang="id">ID</button>
      </div>

      <button id="refreshBtn" class="btn btn-icon" type="button" data-i18n-title="refresh" title="Refresh">
        <span aria-hidden="true">⟳</span>
      </button>
      
      <!-- NEW: Theme Toggle Button -->
      <button id="themeToggle" class="btn btn-icon" type="button" title="Toggle Dark Mode">
        <span aria-hidden="true">🌙</span>
      </button>

    </div>
  </div>

  <div class="watch-chips" id="watchChips"></div>
</header>

<!-- ==================== LIVE TICKER ==================== -->
<div class="ticker-wrap" aria-hidden="true">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<!-- ==================== STICKY FILTER BAR ==================== -->
<nav class="filters" id="filters" aria-label="Source filter"></nav>

<!-- ==================== NEWS VIEW ==================== -->
<main class="container" id="newsView">
  <div class="status" id="status"></div>
  
  <!-- NEW: AI Daily Briefing -->
  <div class="briefing-container">
    <button id="generateBriefingBtn" class="ai-btn" style="font-size: 14px; padding: 10px 20px; margin-bottom: 0;">
      ✨ Generate Today's Market Briefing
    </button>
    <div id="briefingContent" class="ai-summary-box" style="font-size: 14px; padding: 20px;"></div>
  </div>

  <section class="hero" id="hero" aria-label="Top stories"></section>
  <section class="grid" id="grid" aria-label="Latest stories"></section>
</main>

<!-- ==================== STOCKS VIEW ==================== -->
<main class="container" id="stocksView" style="display: none;">
  <div class="mkt-view-head">
    <h1 class="page-title" data-i18n="mktTitle">Market Data</h1>
    <div class="mkt-view-tabs" id="mktViewTabs" role="tablist">
      <button type="button" class="mkt-view-tab active" data-mkt-view="holdings" role="tab" aria-selected="true" data-i18n="mktTabHoldings">My holdings</button>
      <button type="button" class="mkt-view-tab" data-mkt-view="explore" role="tab" aria-selected="false" data-i18n="mktTabExplore">Explore markets</button>
      <button type="button" class="mkt-view-tab" data-mkt-view="ipos" role="tab" aria-selected="false" data-i18n="mktTabIpos">IPOs</button>
    </div>
  </div>

  <!-- My holdings: tracker, performance, allocation, activity, positions, news -->
  <div id="holdingsView">
    <div id="portfolioPanel"></div>
  </div>

  <!-- Explore: look up a ticker, or read the market board -->
  <div id="exploreView" hidden>
    <div class="stock-search-box">
      <input type="text" id="stockSearchInput" data-i18n-ph="searchPh" placeholder="Search ticker (e.g., AAPL, BBCA.JK)…" autocomplete="off" />
      <button type="button" id="stockSearchBtn" data-i18n="searchBtn">Search</button>
    </div>
    <div id="stockDashboard"></div>
  </div>

  <!-- IPOs: deals with a public filing or a priced range, drawn from
       js/ipos-data.js when this tab is first opened -->
  <div id="iposView" hidden>
    <div id="ipoBoard"></div>
  </div>
</main>

<!-- ==================== FOOTER ==================== -->
<footer class="footer">
  <div class="footer-inner">
    <span class="footer-brand">FIN<span class="accent">WIRE</span></span>
    <p data-i18n="footer">FINWIRE — client-side market news aggregator. Data via public RSS feeds &amp; CORS proxies.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<!--
  ============================ SCRIPT ORDER ============================
  These are plain classic scripts, not modules: all of them share one global
  scope and run top to bottom. A function or const declared in an earlier
  file is visible to every later file, and two files declaring the same name
  is a hard error. So the order below is a dependency chain, not a taste:

    apexcharts          chart library, must stay first
    config.js           timers, feed list, symbol pools
    i18n.js             every string, both languages
    core.js             state, esc(), storage and formatting helpers
    feeds.js            CORS proxies, RSS parsing, lead images
    news.js             news page, ticker, filters, view switching
    market-data.js      quotes, history, benchmark series
    stock.js            search and the financials modal
    valuation.js        the DCF model behind that modal
    dividends.js        dividend scan, leaders, market breadth
    world.js            the world index board
    markets.js          the explore board
    ipos-data.js        the curated IPO pipeline (facts, sources, unknowns)
    ipos.js             the IPO board and its filing dossier
    portfolio.js        ledger, XIRR, CSV export, fx helpers
    buzz.js             news mention ranking
    portfolio-quotes.js portfolio quotes, fx conversion, holdings news
    portfolio-views.js  activity, allocation, trend, risk, dividend income
    portfolio-goal.js   goal target, contributions and the projection
    portfolio-render.js paints the portfolio page
    shell.js            boot, AI requests, UI wiring (always last: it calls init())

  ADDING A FEATURE: put its code in js/<feature>.js and insert its <script>
  tag after the files it reads at parse time (at minimum core.js, plus
  anything it calls while loading) and before shell.js. Never append it after
  shell.js, because init() runs there and would reach for the feature before
  it exists. Nothing else needs registering: no build step, no manifest, no
  import list. Editing a file already in this list is safe; only new files
  need a new tag, and it must go in the right place.
  =====================================================================
-->
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/feeds.js"></script>
<script src="js/news.js"></script>
<script src="js/market-data.js"></script>
<script src="js/stock.js"></script>
<script src="js/valuation.js"></script>
<script src="js/dividends.js"></script>
<script src="js/world.js"></script>
<script src="js/markets.js"></script>
<script src="js/ipos-data.js"></script>
<script src="js/ipos.js"></script>
<script src="js/portfolio.js"></script>
<script src="js/buzz.js"></script>
<script src="js/portfolio-quotes.js"></script>
<script src="js/portfolio-views.js"></script>
<script src="js/portfolio-goal.js"></script>
<script src="js/portfolio-render.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
